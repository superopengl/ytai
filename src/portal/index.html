<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="YouTutorAI is a Socratic AI homework tutor for kids 8–14. Snap a worksheet, circle what's tricky, and get calm, step-by-step guidance in math, thinking skills, English, and writing."
    />
    <title>YouTutorAI</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Font weights trimmed to what the homepage paints above the fold:
        - Plus Jakarta Sans 700/800: hero h1 + section h2 headings.
        - Poppins 400/500/700: body, intro paragraph, footer text.
      Other weights asked for by deeper routes (e.g. 600 on LogoPage)
      fall back to the browser's nearest-weight synthesis. Cuts the
      font CSS from 9 declared weights to 5, which translates to
      ~3 woff2 files instead of 5.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Poppins:wght@400;500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Poppins:wght@400;500;700&display=swap"
      />
    </noscript>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #F8FBFC;
        color: #1E3A4C;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Plus Jakarta Sans', 'Poppins', system-ui, sans-serif;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
